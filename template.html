<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="brian.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pacifico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pacifico', cursive;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f4f4f4;
            transition: background 0.3s, color 0.3s;
        }
        .container { display: flex; height: 100vh; }
        .sidebar {
            width: 25%;
            padding: 20px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }
        .main {
            width: 75%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }
        h1 { font-size: 24px; text-align: center; }
        button {
            padding: 10px;
            cursor: pointer;
            border: none;
            font-size: 16px;
            background: #4caf50;
            color: white;
            border-radius: 5px;
        }
        button:hover { background: #45a049; }
        .theme-toggle { background: #ff9800; color: white; }

        /* Color Slider */
        .color-slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 80%;
            height: 10px;
            background: linear-gradient(to right, red, orange, yellow, green, cyan, blue, violet);
            border-radius: 5px;
            outline: none;
            transition: opacity .15s ease-in-out;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            border: 2px solid black;
            cursor: pointer;
            transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .selected-color {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            transition: background 0.2s;
        }

        /* Dark Mode */
        .dark-mode { background-color: #121212; color: #ffffff; }
        .dark-mode .sidebar { background: #1e272e; }
        .dark-mode .main { background: #222; }
        .dark-mode button { background: #ffcc00; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar for Controls -->
        <div class="sidebar">
            <h1>{{ sidebar_heading }}</h1>
            <button onclick="brian_sim.run(); return false;">{{ start_button_text }}</button>
            <button id="theme-toggle" class="theme-toggle">{{ theme_toggle_text }}</button>

            <!-- Graph Color Selection (Slider) -->
            <h3>{{ color_slider_heading }}</h3>
            <div class="color-slider-container">
                <input type="range" id="color-slider" min="0" max="360" value="30">
                <div class="selected-color" id="color-preview"></div>
            </div>
        </div>

        <!-- Main Content (Graph & Simulation Output) -->
        <div class="main">
            <h1>{{ main_heading }}</h1>
            <progress id="brian_progress_bar" max=1.0 value=0.0 style="width: 20em"></progress>
            <div style='width: 90%; height:400px; text-align: center'>
                <canvas id="brian_canvas"></canvas>
            </div>
            <div id='brian_progress_text' style="float:right"></div>
        </div>
    </div>

    <script>
        let myChart = null; // Track Chart instance
        let currentGraphColor = "hsl(30, 100%, 50%)"; // Default color

        function {{ plot_function }}(event) {
            /* Custom graph plotting logic */
        }

        var brian_sim = new BrianSimulation(result_plots=[{type: 'custom', func: window["{{ plot_function }}"] }]);

        // Ensure Brian simulation initializes on page load
        window.onload = (event) => {
            brian_sim.init();
        };

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark-mode", document.body.classList.contains("dark-mode") ? "enabled" : "disabled");
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (localStorage.getItem("dark-mode") === "enabled") {
                document.body.classList.add("dark-mode");
            }

            document.getElementById("theme-toggle").addEventListener("click", toggleDarkMode);

            // Color Slider Functionality
            const colorSlider = document.getElementById("color-slider");
            const colorPreview = document.getElementById("color-preview");

            colorSlider.addEventListener("input", function () {
                let hue = this.value;
                currentGraphColor = `hsl(${hue}, 100%, 50%)`; // Convert to HSL color
                colorPreview.style.background = currentGraphColor;

                if (myChart) {
                    myChart.data.datasets[0].borderColor = currentGraphColor;
                    myChart.update();
                }
            });

            colorPreview.style.background = currentGraphColor;
        });
    </script>
</body>
</html>
